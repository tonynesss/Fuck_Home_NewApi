name: Android CI

# 手动触发，只做编译检查。
#
# 与原版工作流的区别（原版见 8e73949 之前的历史）：
#   - 原版在 push 到 master 时自动运行，用维护者的密钥（alias xiao_wine）签名，
#     上传 APK artifacts，并用 BOT_TOKEN 把包发到 Telegram 频道；
#   - fork 不会继承上游的 secrets，而且「等待原作者授权期间不发布成品」是当前意图，
#     所以这些步骤全部移除，改为仅手动触发的编译检查。
#   - 拿到授权后若想让 CI 签名并产出 APK，参考 git 历史里的旧版工作流。
#
# 注意：本工作流依赖 compileSdk 37 / build-tools 37，未在 GitHub Runner 上实测过。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-deps

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug assembleRelease
